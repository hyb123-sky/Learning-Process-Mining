<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>PathForge — Use and Interpret Views 学習</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=JetBrains+Mono:wght@400;500&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --white:#fff; --off:#FAFAFA; --line:#E6E6E6; --line2:#D0D0D0;
    --mute:#8A8A8A; --text2:#4A4A4A; --text:#0A0A0A;
    --success:#2E6B26; --success-bg:#E8F1E4;
    --danger:#7A1F19; --danger-bg:#F6E3E1;
    --gold:#B8933A;
    --serif:"Cormorant Garamond",Georgia,serif;
    --sans:"Manrope",-apple-system,system-ui,sans-serif;
    --mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0;background:var(--white);color:var(--text);font-family:var(--sans);
            -webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;}
  a{color:inherit}
  button{font-family:inherit}
  .wrap{max-width:760px;margin:0 auto;padding:28px 24px 120px;}
  /* Header */
  .topbar{position:sticky;top:0;background:rgba(255,255,255,0.92);backdrop-filter:blur(10px);
          border-bottom:1px solid var(--line);z-index:10;}
  .topbar-inner{max-width:760px;margin:0 auto;padding:14px 24px;display:flex;align-items:center;gap:14px;}
  .backbtn{background:none;border:0;padding:6px;cursor:pointer;color:var(--text);display:inline-flex;}
  .topbar .quest{flex:1;font-size:11px;font-weight:700;letter-spacing:0.22em;text-transform:uppercase;color:var(--text);}
  .topbar .meta{font-family:var(--mono);font-size:10px;color:var(--mute);letter-spacing:0.14em;text-transform:uppercase;}
  /* Typography */
  .eyebrow{font-size:10.5px;font-weight:700;letter-spacing:0.24em;text-transform:uppercase;color:var(--mute);}
  .title-xl{font-family:var(--serif);font-weight:500;font-size:42px;line-height:1.1;letter-spacing:-0.02em;margin:10px 0 12px;}
  .title-lg{font-family:var(--serif);font-weight:500;font-size:30px;line-height:1.15;letter-spacing:-0.015em;margin:0 0 12px;}
  .title-md{font-family:var(--serif);font-weight:600;font-size:22px;line-height:1.25;margin:28px 0 10px;}
  .lead{font-family:var(--serif);font-style:italic;font-size:17px;color:var(--text2);line-height:1.55;margin:0 0 28px;max-width:560px;}
  p{font-size:15.5px;line-height:1.75;color:var(--text);margin:0 0 16px;}
  ul.clean{padding:0;margin:0 0 18px;list-style:none;}
  ul.clean li{position:relative;padding:6px 0 6px 22px;font-size:15px;line-height:1.65;color:var(--text);}
  ul.clean li::before{content:"";position:absolute;left:4px;top:16px;width:8px;height:1px;background:var(--text);}
  /* Component cards */
  .card{border:1px solid var(--line);padding:18px 20px;margin:0 0 16px;background:var(--white);}
  .card.featured{border-color:var(--text);}
  .term{display:grid;grid-template-columns:180px 1fr;gap:14px;align-items:start;border-left:1px solid var(--line);padding:10px 0 10px 14px;margin:4px 0 16px;}
  .term .en{font-family:var(--mono);font-size:11px;letter-spacing:0.08em;color:var(--mute);text-transform:uppercase;margin-bottom:4px;}
  .term .ja{font-family:var(--serif);font-size:19px;color:var(--text);}
  .term .gloss{font-size:14px;line-height:1.7;color:var(--text);}
  .callout{border-left:2px solid var(--text);padding:12px 16px;margin:0 0 16px;background:var(--off);font-size:14.5px;line-height:1.7;}
  .callout.info{border-color:var(--text);}
  .callout.warn{border-color:var(--danger);background:var(--danger-bg);}
  .callout.success{border-color:var(--success);background:var(--success-bg);}
  table.pf{width:100%;border-collapse:collapse;margin:8px 0 18px;font-size:13.5px;}
  table.pf th,table.pf td{border:1px solid var(--line);padding:9px 10px;text-align:left;vertical-align:top;line-height:1.5;}
  table.pf th{background:var(--off);font-weight:700;font-size:11px;letter-spacing:0.08em;text-transform:uppercase;color:var(--text);}
  .pqlbox{font-family:var(--mono);font-size:12px;line-height:1.75;background:var(--off);border:1px solid var(--line);padding:12px 14px;white-space:pre-wrap;color:var(--text);margin:0 0 8px;}
  .pqlcap{font-size:12.5px;color:var(--mute);margin:0 0 18px;}
  blockquote.pf{border-left:2px solid var(--text);padding:6px 0 6px 18px;margin:0 0 16px;font-family:var(--serif);font-style:italic;font-size:18px;color:var(--text);line-height:1.55;}
  blockquote.pf cite{display:block;margin-top:6px;font-family:var(--mono);font-style:normal;font-size:11px;color:var(--mute);letter-spacing:0.1em;text-transform:uppercase;}
  /* Buttons */
  .btn{background:var(--text);color:var(--white);border:0;padding:15px 22px;
       font-family:var(--sans);font-weight:600;font-size:13px;letter-spacing:0.1em;
       text-transform:uppercase;cursor:pointer;display:inline-flex;align-items:center;gap:10px;
       transition:transform 140ms cubic-bezier(.22,1,.36,1);}
  .btn:hover{transform:translateY(-1px);}
  .btn:disabled{background:var(--line);color:var(--mute);cursor:not-allowed;transform:none;}
  .btn.ghost{background:transparent;color:var(--text);border:1px solid var(--text);padding:14px 21px;}
  .btn.full{width:100%;justify-content:center;}
  /* Chapter list */
  .chapter-row{display:flex;gap:18px;align-items:flex-start;padding:18px 0;border-bottom:1px solid var(--line);cursor:pointer;text-decoration:none;color:inherit;}
  .chapter-row:hover{background:var(--off);}
  .chapter-row.locked{opacity:0.4;cursor:not-allowed;}
  .chapter-num{flex-shrink:0;width:44px;height:44px;border:1px solid var(--text);display:flex;align-items:center;justify-content:center;font-family:var(--mono);font-size:15px;font-weight:700;}
  .chapter-num.done{background:var(--text);color:var(--white);}
  .chapter-body{flex:1;}
  .chapter-body .t{font-family:var(--serif);font-size:19px;font-weight:500;color:var(--text);margin:0 0 4px;line-height:1.25;}
  .chapter-body .m{font-family:var(--mono);font-size:10.5px;letter-spacing:0.14em;color:var(--mute);text-transform:uppercase;}
  /* Objectives block */
  .obj{border:1px solid var(--line);padding:16px 18px;margin:0 0 28px;background:var(--off);}
  .obj .eb{margin-bottom:8px;}
  /* Trial */
  .trial-prog{display:flex;align-items:center;gap:12px;margin-bottom:20px;}
  .trial-prog .bar{flex:1;height:2px;background:var(--line);}
  .trial-prog .bar > div{height:100%;background:var(--text);transition:width 280ms cubic-bezier(.22,1,.36,1);}
  .trial-prog .count{font-family:var(--mono);font-size:11px;color:var(--text);letter-spacing:0.14em;min-width:48px;text-align:right;}
  .q-prompt{font-family:var(--serif);font-size:22px;font-weight:500;color:var(--text);line-height:1.35;margin:14px 0 20px;}
  .opt{display:flex;gap:14px;align-items:flex-start;padding:12px 2px;border-bottom:1px solid var(--line);
       cursor:pointer;}
  .opt:hover:not(.disabled){background:var(--off);}
  .opt.disabled{cursor:default;}
  .opt .box{flex-shrink:0;width:18px;height:18px;border:1px solid var(--text);margin-top:3px;position:relative;}
  .opt.radio .box{border-radius:50%;}
  .opt.checked .box{background:var(--text);}
  .opt.correct{border-bottom-color:var(--success);}
  .opt.correct .box{background:var(--success);border-color:var(--success);}
  .opt.incorrect{border-bottom-color:var(--danger);}
  .opt.incorrect .box{background:var(--danger);border-color:var(--danger);}
  .opt .label{flex:1;font-size:15px;line-height:1.6;color:var(--text);}
  .opt .flag{font-family:var(--mono);font-size:10.5px;letter-spacing:0.14em;margin-top:4px;}
  .opt.correct .flag{color:var(--success);}
  .opt.incorrect .flag{color:var(--danger);}
  .expl{background:var(--off);border-left:2px solid var(--text);padding:14px 16px;margin:18px 0 0;font-size:14px;line-height:1.7;color:var(--text);}
  .expl .tag{font-family:var(--mono);font-size:10px;letter-spacing:0.2em;color:var(--mute);text-transform:uppercase;margin-bottom:6px;display:block;}
  /* Result */
  .score{display:flex;align-items:baseline;gap:12px;}
  .score .num{font-family:var(--serif);font-size:78px;font-weight:500;line-height:1;letter-spacing:-0.03em;}
  .score .of{font-family:var(--mono);font-size:14px;color:var(--mute);letter-spacing:0.14em;}
  .score .pct{font-family:var(--mono);font-size:12px;color:var(--text);letter-spacing:0.14em;margin-left:auto;padding:4px 10px;border:1px solid var(--text);}
  .result-row{padding:14px 0;border-bottom:1px solid var(--line);}
  .result-row .qn{font-family:var(--mono);font-size:10.5px;color:var(--mute);letter-spacing:0.16em;text-transform:uppercase;}
  .result-row .qt{font-family:var(--serif);font-size:16px;margin:2px 0 6px;}
  .result-row.ok .qn{color:var(--success);}
  .result-row.ng .qn{color:var(--danger);}
  .footer-bar{position:fixed;left:0;right:0;bottom:0;background:var(--white);border-top:1px solid var(--line);padding:14px 24px;z-index:5;}
  .footer-inner{max-width:760px;margin:0 auto;display:flex;gap:12px;justify-content:space-between;align-items:center;}
  .tiny{font-family:var(--mono);font-size:10.5px;color:var(--mute);letter-spacing:0.14em;text-transform:uppercase;}
  .hidden{display:none !important;}
  .status{padding:40px 0;text-align:center;color:var(--mute);font-family:var(--mono);font-size:12px;letter-spacing:0.14em;text-transform:uppercase;}
  /* Crest */
  .crest-line{display:flex;justify-content:center;padding:20px 0 8px;}
  .crest-line svg{display:block;}
</style>
</head>
<body>

<!-- Topbar -->
<div class="topbar">
  <div class="topbar-inner">
    <button class="backbtn" id="backBtn" style="display:none">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M15 6l-6 6 6 6"/></svg>
    </button>
    <div class="quest" id="topQuest">PathForge · 学習</div>
    <div class="meta" id="topMeta"></div>
  </div>
</div>

<div class="wrap" id="root">
  <div class="status">Loading…</div>
</div>

<!-- Content modules (plain JS — work via file://) -->
<script src="content/quests/use-and-interpret-views/index.js"></script>
<script src="content/quests/use-and-interpret-views/ch01.js"></script>
<script src="content/quests/use-and-interpret-views/ch02.js"></script>

<script>
(function(){
  "use strict";

  const QUEST_ID = "use-and-interpret-views";
  const quest = window.PFContent && window.PFContent.quests && window.PFContent.quests[QUEST_ID];

  const root = document.getElementById("root");
  const backBtn = document.getElementById("backBtn");
  const topMeta = document.getElementById("topMeta");
  const topQuest = document.getElementById("topQuest");

  if (!quest || !quest.chapters || quest.chapters.length === 0) {
    root.innerHTML = '<div class="status">コンテンツを読み込めませんでした。ブラウザのコンソールを確認してください。</div>';
    return;
  }
  topQuest.textContent = quest.title.ja;

  // ───────────────────────── State
  let view = "index";      // 'index' | 'reader' | 'trial' | 'result'
  let currentChapterId = null;
  let qIdx = 0;
  let answers = {};        // { qid: 'a' | ['a','c'] }
  let submittedQ = {};     // { qid: true } per-question submit flags

  // ───────────────────────── Helpers
  function esc(s){ return String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
  function getChapter(id){ return quest.chapters.find(c => c.id === id); }
  function arraysEqUnordered(a, b){
    if (!Array.isArray(a) || !Array.isArray(b)) return false;
    if (a.length !== b.length) return false;
    const sa = [...a].sort(); const sb = [...b].sort();
    return sa.every((x,i) => x === sb[i]);
  }
  function isCorrect(q, ans){
    if (ans === undefined || ans === null) return false;
    if (q.type === "multi") return arraysEqUnordered(ans, q.correct);
    return ans === q.correct;
  }
  function answerGiven(q, ans){
    if (ans === undefined || ans === null) return false;
    if (q.type === "multi") return Array.isArray(ans) && ans.length > 0;
    return true;
  }

  // ───────────────────────── Renderers
  function renderIndex(){
    topMeta.textContent = quest.chapters.length + " CHAPTERS";
    backBtn.style.display = "none";
    const shield = `
      <svg width="72" height="84" viewBox="0 0 120 140" fill="none" stroke="#0A0A0A" stroke-width="1.2">
        <path d="M60 6 L108 14 L108 58 Q108 100 60 130 Q12 100 12 58 L12 14 Z"/>
        <path d="M60 14 L100 22 L100 56 Q100 92 60 118 Q20 92 20 56 L20 22 Z"/>
        <line x1="60" y1="30" x2="60" y2="98"/>
        <line x1="32" y1="62" x2="88" y2="62"/>
        <circle cx="60" cy="30" r="3" fill="#0A0A0A"/>
        <circle cx="60" cy="98" r="3" fill="#0A0A0A"/>
      </svg>`;

    const chapterRows = quest.chapter_index.map(meta => {
      const chLoaded = getChapter(meta.id);
      const locked = !chLoaded;
      const qCount = chLoaded ? chLoaded.trial.questions.length : "–";
      const duration = chLoaded ? chLoaded.duration_min + " min" : "近日公開";
      const insight = chLoaded ? chLoaded.insight + " INSIGHT" : "—";
      return `<a class="chapter-row ${locked?'locked':''}" ${locked?'':`data-chapter="${meta.id}"`}>
          <div class="chapter-num">${String(meta.idx).padStart(2,'0')}</div>
          <div class="chapter-body">
            <div class="t">${esc(meta.title_ja)}</div>
            <div class="m">Ch. ${String(meta.idx).padStart(2,'0')} · ${qCount} 問 · ${duration} · ${insight}</div>
          </div>
          <div style="align-self:center;color:var(--mute);">›</div>
        </a>`;
    }).join("");

    root.innerHTML = `
      <div class="crest-line">${shield}</div>
      <div class="eyebrow" style="text-align:center;">${esc(quest.subtitle.ja)}</div>
      <h1 class="title-xl" style="text-align:center;">${esc(quest.title.ja)}</h1>
      <p class="lead" style="margin-left:auto;margin-right:auto;text-align:center;">${esc(quest.description_ja)}</p>
      <div class="eyebrow" style="margin:30px 0 4px;">Chapters</div>
      ${chapterRows}
      <div style="margin-top:30px;padding:14px 0;font-family:var(--mono);font-size:10.5px;color:var(--mute);letter-spacing:0.14em;text-transform:uppercase;text-align:center;">
        合格目標 ${Math.round(quest.target_score*100)}% · 合格点 ${Math.round(quest.passing_score*100)}%
      </div>`;

    root.querySelectorAll("[data-chapter]").forEach(a => {
      a.addEventListener("click", () => {
        currentChapterId = a.getAttribute("data-chapter");
        view = "reader";
        render();
        window.scrollTo(0,0);
      });
    });
  }

  function renderBodyItem(item){
    switch(item.type){
      case "para":     return `<p>${esc(item.ja)}</p>`;
      case "h2":       return `<h2 class="title-md">${esc(item.ja)}</h2>`;
      case "h3":       return `<h3 style="font-family:var(--serif);font-size:18px;font-weight:600;margin:20px 0 8px;">${esc(item.ja)}</h3>`;
      case "list":     return `<ul class="clean">${item.items.map(i => `<li>${esc(i.ja)}</li>`).join("")}</ul>`;
      case "term":     return `<div class="term">
          <div>
            <div class="en">${esc(item.en||'')}</div>
            <div class="ja">${esc(item.ja||'')}</div>
          </div>
          <div class="gloss">${esc(item.gloss_ja||'')}</div>
        </div>`;
      case "callout":  return `<div class="callout ${item.variant||'info'}">${esc(item.ja)}</div>`;
      case "table":    return `<table class="pf">
          <thead><tr>${item.headers.map(h => `<th>${esc(h.ja)}</th>`).join("")}</tr></thead>
          <tbody>${item.rows.map(r => `<tr>${r.map(c => `<td>${esc(c.ja)}</td>`).join("")}</tr>`).join("")}</tbody>
        </table>`;
      case "pql":      return `<div class="pqlbox">${esc(item.code)}</div>
        ${item.caption_ja ? `<div class="pqlcap">${esc(item.caption_ja)}</div>` : ""}`;
      case "quote":    return `<blockquote class="pf">${esc(item.ja)}${item.cite ? `<cite>${esc(item.cite)}</cite>` : ""}</blockquote>`;
      default:         return "";
    }
  }

  function renderReader(){
    const ch = getChapter(currentChapterId);
    if (!ch){ view = "index"; render(); return; }
    topMeta.textContent = `CH. ${String(ch.idx).padStart(2,'0')} / ${quest.total_chapters}`;
    backBtn.style.display = "inline-flex";
    backBtn.onclick = () => { view = "index"; render(); window.scrollTo(0,0); };

    const objectivesHTML = `<div class="obj">
        <div class="eyebrow eb">学習到達点</div>
        <ul class="clean" style="margin:0">${ch.objectives.map(o => `<li>${esc(o.ja)}</li>`).join("")}</ul>
      </div>`;
    const bodyHTML = ch.body.map(renderBodyItem).join("");

    root.innerHTML = `
      <div class="eyebrow">Ch. ${String(ch.idx).padStart(2,'0')} · ${ch.duration_min} min · ${ch.insight} Insight</div>
      <h1 class="title-lg" style="font-size:38px;margin-top:10px;">${esc(ch.title.ja)}</h1>
      <p class="lead">${esc(ch.summary.ja)}</p>
      ${objectivesHTML}
      ${bodyHTML}
      <div style="height:24px"></div>`;

    // Footer bar with CTA
    showFooter(`<span class="tiny">Trial: ${ch.trial.questions.length} 問</span>
      <button class="btn" id="startTrial">Trial を始める <span style="font-family:var(--mono);font-size:11px;opacity:0.7;">→</span></button>`);
    document.getElementById("startTrial").onclick = () => {
      view = "trial"; qIdx = 0; answers = {}; submittedQ = {};
      render(); window.scrollTo(0,0);
    };
  }

  function renderTrial(){
    const ch = getChapter(currentChapterId);
    if (!ch){ view = "index"; render(); return; }
    const qs = ch.trial.questions;
    const q = qs[qIdx];
    const submitted = !!submittedQ[q.id];
    const ans = answers[q.id];
    const correct = isCorrect(q, ans);

    topMeta.textContent = `CH. ${String(ch.idx).padStart(2,'0')} · TRIAL`;
    backBtn.style.display = "inline-flex";
    backBtn.onclick = () => {
      if (confirm("Trial を中断して章の閲覧に戻りますか？進捗は失われます。")) {
        view = "reader"; render(); window.scrollTo(0,0);
      }
    };

    const prog = ((qIdx+1)/qs.length)*100;
    const optsHTML = q.options.map(o => {
      let cls = q.type === "multi" ? "opt" : "opt radio";
      let checked = false;
      if (q.type === "multi") checked = Array.isArray(ans) && ans.includes(o.id);
      else checked = ans === o.id;
      if (checked) cls += " checked";
      let flag = "";
      if (submitted){
        cls += " disabled";
        let isThisCorrect = false;
        if (q.type === "multi") isThisCorrect = q.correct.includes(o.id);
        else isThisCorrect = q.correct === o.id;
        if (isThisCorrect){ cls += " correct"; flag = `<div class="flag">正解</div>`; }
        else if (checked){ cls += " incorrect"; flag = `<div class="flag">不正解</div>`; }
      }
      return `<div class="${cls}" data-opt="${o.id}">
          <div class="box"></div>
          <div class="label">${esc(o.ja)}${flag}</div>
        </div>`;
    }).join("");

    const diffMap = { easy:"易", med:"中", hard:"難" };
    const diffLabel = diffMap[q.difficulty] || "";

    root.innerHTML = `
      <div class="trial-prog">
        <span class="tiny">Q ${qIdx+1}</span>
        <div class="bar"><div style="width:${prog}%"></div></div>
        <span class="count">${qIdx+1} / ${qs.length}</span>
      </div>
      <div class="tiny" style="color:var(--mute);">${q.type === "multi" ? "複数選択" : q.type === "truefalse" ? "正誤判定" : "単一選択"} · 難度 ${diffLabel}</div>
      <div class="q-prompt">${esc(q.prompt_ja)}</div>
      <div>${optsHTML}</div>
      ${submitted ? `<div class="expl"><span class="tag">解説</span>${esc(q.explain_ja)}</div>` : ""}`;

    // Attach option handlers
    if (!submitted){
      root.querySelectorAll(".opt").forEach(el => {
        el.addEventListener("click", () => {
          const optId = el.getAttribute("data-opt");
          if (q.type === "multi"){
            const cur = Array.isArray(answers[q.id]) ? [...answers[q.id]] : [];
            const i = cur.indexOf(optId);
            if (i >= 0) cur.splice(i, 1); else cur.push(optId);
            answers[q.id] = cur;
          } else {
            answers[q.id] = optId;
          }
          render();
        });
      });
    }

    // Footer
    if (!submitted){
      const canSubmit = answerGiven(q, ans);
      showFooter(`<span class="tiny">${q.type === "multi" ? "該当するすべてを選択" : "一つ選択"}</span>
        <button class="btn" id="submitQ" ${canSubmit?"":"disabled"}>答えを送信</button>`);
      const sb = document.getElementById("submitQ");
      if (sb) sb.onclick = () => { submittedQ[q.id] = true; render(); };
    } else {
      const label = (qIdx === qs.length - 1) ? "結果を見る" : "次の問題";
      showFooter(`<span class="tiny">${correct ? "正解" : "不正解"}</span>
        <button class="btn" id="nextQ">${label}</button>`);
      document.getElementById("nextQ").onclick = () => {
        if (qIdx === qs.length - 1){ view = "result"; render(); window.scrollTo(0,0); }
        else { qIdx++; render(); window.scrollTo(0,0); }
      };
    }
  }

  function renderResult(){
    const ch = getChapter(currentChapterId);
    if (!ch){ view = "index"; render(); return; }
    const qs = ch.trial.questions;
    const total = qs.length;
    let correctCount = 0;
    qs.forEach(q => { if (isCorrect(q, answers[q.id])) correctCount++; });
    const pct = correctCount / total;
    const passed = pct >= quest.passing_score;
    const targetMet = pct >= quest.target_score;

    topMeta.textContent = `CH. ${String(ch.idx).padStart(2,'0')} · RESULT`;
    backBtn.style.display = "inline-flex";
    backBtn.onclick = () => { view = "index"; render(); window.scrollTo(0,0); };

    const rowsHTML = qs.map((q, i) => {
      const ok = isCorrect(q, answers[q.id]);
      const given = answers[q.id];
      const givenLabel = Array.isArray(given) ? given.join(", ") : (given || "未回答");
      const correctLabel = Array.isArray(q.correct) ? q.correct.join(", ") : q.correct;
      return `<div class="result-row ${ok?'ok':'ng'}">
          <div class="qn">Q${i+1} · ${ok?'正解':'不正解'}</div>
          <div class="qt">${esc(q.prompt_ja)}</div>
          <div style="font-size:13px;color:var(--text2);line-height:1.7;">
            あなたの回答: <code style="font-family:var(--mono);">${esc(givenLabel)}</code> &nbsp;·&nbsp;
            正解: <code style="font-family:var(--mono);">${esc(correctLabel)}</code>
          </div>
          ${!ok ? `<div class="expl" style="margin-top:10px;"><span class="tag">解説</span>${esc(q.explain_ja)}</div>` : ""}
        </div>`;
    }).join("");

    const verdict = targetMet ? "高得点合格 — 章マスター" : passed ? "合格 — 目標にもう一歩" : "不合格 — 再挑戦推奨";
    const verdictColor = targetMet ? "var(--success)" : passed ? "var(--text)" : "var(--danger)";

    root.innerHTML = `
      <div class="eyebrow">${esc(ch.title.ja)} — Trial 結果</div>
      <div class="score" style="margin:14px 0 4px;">
        <span class="num">${correctCount}</span>
        <span class="of">/ ${total}</span>
        <span class="pct">${Math.round(pct*100)}%</span>
      </div>
      <div style="font-family:var(--serif);font-size:20px;font-style:italic;color:${verdictColor};margin:0 0 22px;">${verdict}</div>
      <div class="callout info">
        合格点 ${Math.round(quest.passing_score*100)}% / 高得点目標 ${Math.round(quest.target_score*100)}%。
        ${!passed ? "まず誤答問題の解説を読み、本文の該当セクションに戻って Retry を。" : targetMet ? "このまま次章へ進める水準。" : "あと数問を安定させれば本番でも余裕あり。誤答を復習して Retry を推奨。"}
      </div>
      <div class="eyebrow" style="margin-top:26px;">問題別レビュー</div>
      ${rowsHTML}
      <div style="height:10px"></div>`;

    showFooter(`<button class="btn ghost" id="retry">もう一度 Retry</button>
      <button class="btn" id="backToIndex">章一覧へ</button>`);
    document.getElementById("retry").onclick = () => {
      view = "trial"; qIdx = 0; answers = {}; submittedQ = {};
      render(); window.scrollTo(0,0);
    };
    document.getElementById("backToIndex").onclick = () => { view = "index"; render(); window.scrollTo(0,0); };
  }

  // Footer helper
  let footer = null;
  function showFooter(html){
    if (!footer){
      footer = document.createElement("div");
      footer.className = "footer-bar";
      footer.innerHTML = '<div class="footer-inner"></div>';
      document.body.appendChild(footer);
    }
    footer.querySelector(".footer-inner").innerHTML = html;
  }
  function hideFooter(){ if (footer){ footer.remove(); footer = null; } }

  // ───────────────────────── Main render dispatch
  function render(){
    hideFooter();
    if (view === "index")      renderIndex();
    else if (view === "reader")renderReader();
    else if (view === "trial") renderTrial();
    else if (view === "result")renderResult();
  }
  render();
})();
</script>
</body>
</html>
