
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" preserveAspectRatio="none">
  <defs>
    <filter id="noise">
      <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="2" seed="3"></feTurbulence>
      <feColorMatrix values="0 0 0 0 0.78&#xA;                             0 0 0 0 0.70&#xA;                             0 0 0 0 0.55&#xA;                             0 0 0 0.22 0"></feColorMatrix>
    </filter>
    <filter id="fibers">
      <feTurbulence type="turbulence" baseFrequency="0.012 0.5" numOctaves="1" seed="7"></feTurbulence>
      <feColorMatrix values="0 0 0 0 0.55&#xA;                             0 0 0 0 0.45&#xA;                             0 0 0 0 0.30&#xA;                             0 0 0 0.08 0"></feColorMatrix>
    </filter>
  </defs>
  <rect width="400" height="400" fill="#F8F3E6"></rect>
  <rect width="400" height="400" filter="url(#noise)"></rect>
  <rect width="400" height="400" filter="url(#fibers)" opacity="0.6"></rect>
  
  <radialGradient id="vig" cx="0.5" cy="0.5" r="0.7">
    <stop offset="0.6" stop-color="#F8F3E6" stop-opacity="0"></stop>
    <stop offset="1" stop-color="#A87D28" stop-opacity="0.15"></stop>
  </radialGradient>
  <rect width="400" height="400" fill="url(#vig)"></rect>
</svg>