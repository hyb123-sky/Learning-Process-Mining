<!doctype html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body{padding:28px;background:var(--ivory-50);display:flex;flex-wrap:wrap;gap:12px;align-items:center}
  button{border:0;cursor:pointer;font-family:var(--font-sans);font-weight:600;letter-spacing:.04em;font-size:14px;transition:all var(--dur-fast) var(--ease-out)}
  .btn-primary{background:var(--gold-500);color:var(--navy-900);padding:12px 22px;border-radius:var(--radius-md);box-shadow:0 1px 0 var(--gold-700) inset, 0 1px 2px rgba(30,46,79,.15)}
  .btn-primary:hover{background:var(--gold-600);color:#fff}
  .btn-primary:active{transform:scale(.98);box-shadow:var(--shadow-inset)}
  .btn-secondary{background:transparent;color:var(--navy-900);padding:11px 21px;border:1px solid var(--navy-700);border-radius:var(--radius-md)}
  .btn-secondary:hover{background:var(--navy-700);color:var(--ivory-50)}
  .btn-ghost{background:transparent;color:var(--fg-gold);padding:11px 14px}
  .btn-ghost:hover{color:var(--gold-900);background:var(--ivory-100);border-radius:var(--radius-md)}
  .btn-danger{background:var(--danger);color:#fff;padding:12px 22px;border-radius:var(--radius-md)}
  .btn-disabled{background:var(--ivory-200);color:var(--fg-4);padding:12px 22px;border-radius:var(--radius-md);cursor:not-allowed}
</style></head><body>
  <button class="btn-primary">Begin your quest</button>
  <button class="btn-secondary">Resume chapter</button>
  <button class="btn-ghost">Skip for now</button>
  <button class="btn-danger">Abandon path</button>
  <button class="btn-disabled">Locked</button>
</body></html>
