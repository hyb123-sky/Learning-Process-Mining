<!doctype html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body{padding:28px;background:var(--ivory-50);display:grid;grid-template-columns:1fr 1fr;gap:16px}
  .card{background:#fff;border:1px solid var(--ivory-300);border-radius:var(--radius-lg);padding:20px;box-shadow:var(--shadow-sm)}
  .card.featured{border-color:var(--gold-500);background:var(--ivory-100);box-shadow:var(--shadow-glow-gold)}
  .eyebrow{font-family:var(--font-sans);font-size:11px;font-weight:600;letter-spacing:.2em;text-transform:uppercase;color:var(--gold-700);margin-bottom:8px}
  h3{font-family:var(--font-serif);font-size:22px;font-weight:600;color:var(--navy-900);margin:0 0 8px}
  p{font-family:var(--font-sans);font-size:14px;line-height:1.55;color:var(--fg-3);margin:0}
  .meta{display:flex;gap:14px;margin-top:14px;font-family:var(--font-sans);font-size:12px;color:var(--fg-4)}
  .progress{height:4px;background:var(--ivory-200);border-radius:99px;margin-top:12px;overflow:hidden}
  .progress>div{height:100%;background:var(--gold-500);width:62%}
</style></head><body>
  <div class="card">
    <div class="eyebrow">Chapter 3 of 12</div>
    <h3>The Event Log</h3>
    <p>Learn to read the first artifact of any process — row by row, case by case.</p>
    <div class="progress"><div></div></div>
    <div class="meta"><span>· 14 min</span><span>· 210 Insight</span></div>
  </div>
  <div class="card featured">
    <div class="eyebrow">Active quest</div>
    <h3>P2P Certification</h3>
    <p>Procure-to-pay mastery. 8 chapters remaining before your oath.</p>
    <div class="progress"><div></div></div>
    <div class="meta"><span>· Chapter 4</span><span>· 62% forged</span></div>
  </div>
</body></html>
