<!doctype html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body{padding:28px;display:grid;grid-template-columns:repeat(5,1fr);gap:18px;background:var(--ivory-50)}
  .card{background:#fff;border-radius:var(--radius-lg);height:90px;display:flex;align-items:center;justify-content:center;font-family:var(--font-mono);font-size:11px;font-weight:600;color:var(--fg-3)}
  .cap{font-family:var(--font-mono);font-size:10px;color:var(--fg-4);text-align:center;margin-top:6px}
</style></head><body>
  <div><div class="card" style="box-shadow:var(--shadow-xs)">xs</div><div class="cap">--shadow-xs</div></div>
  <div><div class="card" style="box-shadow:var(--shadow-sm)">sm</div><div class="cap">--shadow-sm</div></div>
  <div><div class="card" style="box-shadow:var(--shadow-md)">md</div><div class="cap">--shadow-md</div></div>
  <div><div class="card" style="box-shadow:var(--shadow-lg)">lg</div><div class="cap">--shadow-lg</div></div>
  <div><div class="card" style="box-shadow:var(--shadow-glow-gold)">gold glow</div><div class="cap">--shadow-glow-gold</div></div>
</body></html>
