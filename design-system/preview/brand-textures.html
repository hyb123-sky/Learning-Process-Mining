<!doctype html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body{margin:0;padding:0;background:var(--ivory-50);display:grid;grid-template-columns:1fr 1fr;gap:2px}
  .tex{height:200px;background-size:cover;background-position:center;display:flex;align-items:flex-end;padding:12px}
  .parch{background-image:url(../assets/parchment.svg)}
  .cath{background-image:url(../assets/cathedral-light.svg)}
  .cap{font-family:var(--font-mono);font-size:10px;color:var(--fg-4);background:rgba(253,251,245,.85);padding:4px 8px;border-radius:4px}
  .cap.inv{color:var(--gold-300);background:rgba(15,26,51,.55)}
</style></head><body>
  <div class="tex parch"><span class="cap">parchment.svg · card backing</span></div>
  <div class="tex cath"><span class="cap inv">cathedral-light.svg · hero backdrop</span></div>
</body></html>
