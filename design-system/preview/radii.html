<!doctype html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body{padding:24px;display:grid;grid-template-columns:repeat(6,1fr);gap:14px;align-items:end}
  .box{background:var(--ivory-100);border:1px solid var(--ivory-300);height:72px;display:flex;align-items:center;justify-content:center;color:var(--gold-700);font-family:var(--font-mono);font-size:11px;font-weight:600}
  .cap{font-family:var(--font-mono);font-size:10px;color:var(--fg-4);text-align:center;margin-top:6px}
  .arch{border-radius:var(--radius-arch);background:var(--navy-700);color:var(--gold-300)}
</style></head><body>
  <div><div class="box" style="border-radius:var(--radius-sm)">4</div><div class="cap">--radius-sm</div></div>
  <div><div class="box" style="border-radius:var(--radius-md)">8</div><div class="cap">--radius-md</div></div>
  <div><div class="box" style="border-radius:var(--radius-lg)">14</div><div class="cap">--radius-lg</div></div>
  <div><div class="box" style="border-radius:var(--radius-xl)">20</div><div class="cap">--radius-xl</div></div>
  <div><div class="box" style="border-radius:var(--radius-pill)">pill</div><div class="cap">--radius-pill</div></div>
  <div><div class="box arch">arch</div><div class="cap">--radius-arch</div></div>
</body></html>
