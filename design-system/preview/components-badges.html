<!doctype html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body{padding:28px;background:var(--ivory-50);display:flex;flex-wrap:wrap;gap:10px;align-items:center}
  .badge{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:var(--radius-pill);font-family:var(--font-sans);font-size:12px;font-weight:600;letter-spacing:.04em}
  .b-success{background:var(--success-bg);color:var(--success)}
  .b-warn{background:var(--warn-bg);color:var(--warn)}
  .b-danger{background:var(--danger-bg);color:var(--danger)}
  .b-info{background:var(--info-bg);color:var(--info)}
  .b-gold{background:var(--gold-100);color:var(--gold-700)}
  .b-navy{background:var(--navy-700);color:var(--gold-300)}
  .dot{width:6px;height:6px;border-radius:50%;background:currentColor}
</style></head><body>
  <span class="badge b-success"><span class="dot"></span>Forged</span>
  <span class="badge b-warn"><span class="dot"></span>In progress</span>
  <span class="badge b-danger"><span class="dot"></span>Failed</span>
  <span class="badge b-info"><span class="dot"></span>Queued</span>
  <span class="badge b-gold">Insight +210</span>
  <span class="badge b-navy">Order of P2P</span>
</body></html>
