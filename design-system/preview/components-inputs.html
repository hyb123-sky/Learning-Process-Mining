<!doctype html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body{padding:28px;background:var(--ivory-50);display:grid;grid-template-columns:1fr 1fr;gap:16px}
  .field{display:flex;flex-direction:column;gap:6px}
  label{font-family:var(--font-sans);font-size:12px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--gold-700)}
  input,select{font-family:var(--font-sans);font-size:15px;padding:12px 14px;border:1px solid var(--ivory-300);border-radius:var(--radius-md);background:#fff;color:var(--navy-900);outline:none;transition:all var(--dur-fast) var(--ease-out)}
  input:focus{border-color:var(--gold-500);box-shadow:0 0 0 3px rgba(199,154,58,.2)}
  .hint{font-family:var(--font-sans);font-size:12px;color:var(--fg-4)}
  .err{font-family:var(--font-sans);font-size:12px;color:var(--danger)}
  .error input{border-color:var(--danger);background:var(--danger-bg)}
  .chip{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;background:var(--ivory-200);border-radius:var(--radius-pill);font-family:var(--font-sans);font-size:12px;font-weight:600;color:var(--navy-700)}
  .chip.gold{background:var(--gold-100);color:var(--gold-700)}
</style></head><body>
  <div class="field">
    <label>Email</label>
    <input placeholder="you@order.path"/>
    <span class="hint">We use this for your oath certificate.</span>
  </div>
  <div class="field error">
    <label>Password</label>
    <input type="password" value="wrong"/>
    <span class="err">That passphrase does not match.</span>
  </div>
  <div class="field">
    <label>Path</label>
    <select><option>P2P Certification</option><option>O2C Certification</option></select>
  </div>
  <div class="field">
    <label>Tags</label>
    <div style="display:flex;gap:6px;flex-wrap:wrap;padding-top:4px">
      <span class="chip gold">Process mining</span>
      <span class="chip">Celonis</span>
      <span class="chip">Intermediate</span>
    </div>
  </div>
</body></html>
