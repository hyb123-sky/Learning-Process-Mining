<!doctype html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body{padding:24px;display:grid;grid-template-columns:repeat(5,1fr);gap:12px}
  .sw{border-radius:10px;height:92px;display:flex;flex-direction:column;justify-content:flex-end;padding:10px;font-family:var(--font-mono);font-size:11px;line-height:1.3}
  .on-dark{color:var(--ivory-50)}
  .on-light{color:var(--navy-900)}
  .name{font-weight:700;letter-spacing:.04em}
</style></head><body>
  <div class="sw on-light" style="background:var(--gold-100)"><span class="name">gold-100</span>#F5E6B8</div>
  <div class="sw on-light" style="background:var(--gold-300)"><span class="name">gold-300</span>#E2C568</div>
  <div class="sw on-dark" style="background:var(--gold-500)"><span class="name">gold-500</span>#C79A3A</div>
  <div class="sw on-dark" style="background:var(--gold-600)"><span class="name">gold-600</span>#A87D28</div>
  <div class="sw on-dark" style="background:var(--gold-700)"><span class="name">gold-700</span>#7E5C18</div>
</body></html>
