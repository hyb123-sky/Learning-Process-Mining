<!doctype html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body{padding:0;margin:0;background:var(--ivory-50);display:grid;grid-template-columns:1fr 1fr}
  .panel{padding:28px;display:flex;flex-direction:column;justify-content:center;align-items:center;min-height:200px}
  .light{background:var(--ivory-50)}
  .dark{background:var(--navy-900)}
  .cap{font-family:var(--font-mono);font-size:10px;color:var(--fg-4);margin-top:10px}
  .cap.inv{color:var(--navy-300)}
</style></head><body>
  <div class="panel light"><img src="../assets/logo.svg" style="height:52px"/><span class="cap">logo.svg · on ivory</span></div>
  <div class="panel dark"><img src="../assets/logo-inverse.svg" style="height:52px"/><span class="cap inv">logo-inverse.svg · on navy</span></div>
</body></html>
