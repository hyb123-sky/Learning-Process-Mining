<!doctype html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body{padding:24px;display:grid;grid-template-columns:repeat(5,1fr);gap:12px}
  .sw{border-radius:10px;height:92px;display:flex;flex-direction:column;justify-content:flex-end;padding:10px;font-family:var(--font-mono);font-size:11px;line-height:1.3}
  .on-dark{color:var(--ivory-50)}
  .on-light{color:var(--navy-900)}
  .name{font-weight:700;letter-spacing:.04em}
</style></head><body>
  <div class="sw on-light" style="background:var(--ivory-50);border:1px solid var(--ivory-200)"><span class="name">ivory-50</span>#FDFBF5</div>
  <div class="sw on-light" style="background:var(--ivory-100);border:1px solid var(--ivory-300)"><span class="name">ivory-100</span>#F8F3E6</div>
  <div class="sw on-light" style="background:var(--ivory-200)"><span class="name">ivory-200</span>#EFE6D1</div>
  <div class="sw on-light" style="background:var(--ivory-300)"><span class="name">ivory-300</span>#E2D4B3</div>
  <div class="sw on-light" style="background:var(--ivory-400)"><span class="name">ivory-400</span>#C9B690</div>
</body></html>
