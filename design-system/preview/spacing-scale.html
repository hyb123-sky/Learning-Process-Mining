<!doctype html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body{padding:24px;display:flex;flex-direction:column;gap:10px}
  .row{display:flex;align-items:center;gap:16px}
  .token{font-family:var(--font-mono);font-size:11px;color:var(--fg-3);width:70px}
  .bar{background:var(--gold-500);height:16px;border-radius:3px}
  .px{font-family:var(--font-mono);font-size:11px;color:var(--fg-4);margin-left:auto}
</style></head><body>
  <div class="row"><span class="token">--sp-1</span><span class="bar" style="width:4px"></span><span class="px">4px</span></div>
  <div class="row"><span class="token">--sp-2</span><span class="bar" style="width:8px"></span><span class="px">8px</span></div>
  <div class="row"><span class="token">--sp-3</span><span class="bar" style="width:12px"></span><span class="px">12px</span></div>
  <div class="row"><span class="token">--sp-4</span><span class="bar" style="width:16px"></span><span class="px">16px</span></div>
  <div class="row"><span class="token">--sp-5</span><span class="bar" style="width:20px"></span><span class="px">20px</span></div>
  <div class="row"><span class="token">--sp-6</span><span class="bar" style="width:24px"></span><span class="px">24px</span></div>
  <div class="row"><span class="token">--sp-8</span><span class="bar" style="width:32px"></span><span class="px">32px</span></div>
  <div class="row"><span class="token">--sp-10</span><span class="bar" style="width:40px"></span><span class="px">40px</span></div>
  <div class="row"><span class="token">--sp-12</span><span class="bar" style="width:48px"></span><span class="px">48px</span></div>
  <div class="row"><span class="token">--sp-16</span><span class="bar" style="width:64px"></span><span class="px">64px</span></div>
</body></html>
