<!doctype html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body{padding:28px;display:flex;flex-direction:column;gap:18px}
  .quote{padding:16px 20px;border-left:3px solid var(--gold-500);background:var(--ivory-100)}
  .mono-block{background:var(--ivory-200);border-radius:8px;padding:12px 14px;font-family:var(--font-mono);font-size:13px;color:var(--navy-700);line-height:1.6}
  .label{font-family:var(--font-sans);font-size:11px;font-weight:600;letter-spacing:.18em;text-transform:uppercase;color:var(--gold-700);margin-bottom:6px}
</style></head><body>
  <div>
    <div class="label">Pull Quote · .t-quote</div>
    <div class="quote"><span class="t-quote">The path forward is clear — but seldom easy.</span></div>
  </div>
  <div>
    <div class="label">Code · .t-code + block</div>
    <div class="mono-block">SELECT case_id, activity, timestamp<br>FROM event_log<br>ORDER BY timestamp;</div>
  </div>
</body></html>
