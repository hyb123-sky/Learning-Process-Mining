<!doctype html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body{padding:24px;display:grid;grid-template-columns:repeat(5,1fr);gap:12px}
  .sw{border-radius:10px;height:92px;display:flex;flex-direction:column;justify-content:flex-end;padding:10px;font-family:var(--font-mono);font-size:11px;line-height:1.3}
  .on-dark{color:var(--ivory-50)}
  .on-light{color:var(--navy-900)}
  .name{font-weight:700;letter-spacing:.04em}
</style></head><body>
  <div class="sw on-light" style="background:var(--navy-100)"><span class="name">navy-100</span>#DDE3EF</div>
  <div class="sw on-dark" style="background:var(--navy-300)"><span class="name">navy-300</span>#8B9BB8</div>
  <div class="sw on-dark" style="background:var(--navy-500)"><span class="name">navy-500</span>#3C5278</div>
  <div class="sw on-dark" style="background:var(--navy-700)"><span class="name">navy-700</span>#1E2E4F</div>
  <div class="sw on-dark" style="background:var(--navy-900)"><span class="name">navy-900</span>#0F1A33</div>
</body></html>
