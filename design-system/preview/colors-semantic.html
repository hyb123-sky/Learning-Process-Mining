<!doctype html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body{padding:24px;display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
  .pair{border-radius:10px;overflow:hidden;border:1px solid var(--ivory-300)}
  .bg{padding:14px;display:flex;flex-direction:column;gap:4px}
  .name{font-family:var(--font-sans);font-size:12px;font-weight:700;letter-spacing:.1em;text-transform:uppercase}
  .hex{font-family:var(--font-mono);font-size:10px;opacity:.8}
  .sample{padding:10px 14px;font-family:var(--font-sans);font-size:13px;font-weight:600}
</style></head><body>
  <div class="pair"><div class="bg" style="background:var(--success-bg);color:var(--success)"><span class="name">Success</span><span class="hex">#4F7A46 on #E8EFE3</span></div><div class="sample" style="background:var(--success);color:#fff">Verdigris</div></div>
  <div class="pair"><div class="bg" style="background:var(--warn-bg);color:var(--warn)"><span class="name">Warn</span><span class="hex">#B5761F on #F8ECD6</span></div><div class="sample" style="background:var(--warn);color:#fff">Amber</div></div>
  <div class="pair"><div class="bg" style="background:var(--danger-bg);color:var(--danger)"><span class="name">Danger</span><span class="hex">#94382F on #F3DCD7</span></div><div class="sample" style="background:var(--danger);color:#fff">Sealed wax</div></div>
  <div class="pair"><div class="bg" style="background:var(--info-bg);color:var(--info)"><span class="name">Info</span><span class="hex">#3C5278 on #DDE3EF</span></div><div class="sample" style="background:var(--info);color:#fff">Navy</div></div>
</body></html>
